<html lang="ja">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' http://127.0.0.1:43117 http://localhost:43117; worker-src 'self'; script-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"
    />
    <title>Minutes</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
